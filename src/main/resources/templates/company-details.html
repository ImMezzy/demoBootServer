<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>
<header th:replace="~{fragments/navbar}"></header>
<main id="main-content" class="container">
    <article class="card">
        <h1 th:text="${companyDetails.name}">Название</h1>
        <dl>
            <dt>Город</dt>
            <dd th:text="${companyDetails.town}">Город</dd>
            <dt>Описание</dt>
            <dd th:text="${companyDetails.description}">Описание</dd>
            <dt>Бюджет</dt>
            <dd>
                <span th:text="${#numbers.formatDecimal(
                    companyDetails.budget, 1, 2
                )}">0,00</span> ₽
            </dd>
        </dl>
    </article>
    <a th:href="@{/companies}">Вернуться к списку</a>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
