<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head}"></head>
<body>
<header th:replace="~{fragments/navbar}"></header>
<main id="main-content" class="container">
    <h1>Компании</h1>
    <p>Каталог компаний учебного приложения.</p>

    <div class="grid" th:if="${!#lists.isEmpty(companyInfos)}">
        <article class="card" th:each="company : ${companyInfos}">
            <h2 th:text="${company.name}">Название</h2>
            <p>
                <strong>Город:</strong>
                <span th:text="${company.town}">Город</span>
            </p>
            <p th:text="${company.description}">Описание</p>
            <a th:href="@{/companies/{companyName}(companyName=${company.name})}">
                Подробнее
            </a>
        </article>
    </div>

    <p th:if="${#lists.isEmpty(companyInfos)}">
        Компании пока не добавлены.
    </p>
</main>
<footer th:replace="~{fragments/footer}"></footer>
</body>
</html>
